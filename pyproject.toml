[project]
name = "oura-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "supabase",
    "mcp>=2.3.0",
    "authlib>=1.9.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "python-multipart>=0.0.31",
    "cryptography>=50",
    "starlette>=1.10.0",
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "dnspython>=2.9.0",
    "fsspec>=2026.6.0",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "idna>=3.15",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0"
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
